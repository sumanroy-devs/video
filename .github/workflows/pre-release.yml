name: Make Pre release

permissions:
  contents: write

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+-preview.[0-9]+'

env:
  # Certificate of the Video release key (video.keystore). Installed clients
  # effectively pin this value: an APK signed with anything else cannot be
  # installed as an update over an existing install.
  EXPECTED_SIGNER_SHA256: c0836bdfad9d23851e1f87776c88efac89fc7e105f232c2e32676113d63a2cbd

jobs:
  release-for-github:
    name: "Preview Release for GitHub"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: 17

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Build preview APKs
        run: ./gradlew assemblePreview --stacktrace

      - name: Get tag name
        if: startsWith(github.ref, 'refs/tags/')
        run: echo "VERSION_TAG=${GITHUB_REF#refs/tags/}" >> $GITHUB_ENV

      - name: Verify build output
        run: |
          PREVIEW_DIR="app/build/outputs/apk/preview"
          if [ ! -d "$PREVIEW_DIR" ]; then
            echo "Preview directory does not exist!"
            find app/build/outputs -name "*.apk" -type f
            exit 1
          fi
          ls -lah "$PREVIEW_DIR"

      - name: Sign APKs
        run: |
          set -e
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1)
          if [ -z "$APKSIGNER" ]; then echo "::error::apksigner not found in runner SDK"; exit 1; fi
          PREVIEW_DIR="app/build/outputs/apk/preview"
          
          echo "${{ secrets.SIGNING_KEYSTORE }}" | base64 -d > release.keystore
          
          APK_COUNT=$(find "$PREVIEW_DIR" -name "app-*-preview-unsigned.apk" -type f | wc -l)
          if [ "$APK_COUNT" -eq 0 ]; then
            echo "No unsigned preview APK files found"
            ls -lah "$PREVIEW_DIR"
            rm release.keystore
            exit 1
          fi
          
          find "$PREVIEW_DIR" -name "app-*-preview-unsigned.apk" -type f | while read -r apk; do
            signed_apk="${apk/-unsigned/}"
          
            "$APKSIGNER" sign \
              --ks release.keystore \
              --ks-key-alias "${{ secrets.SIGNING_KEY_ALIAS }}" \
              --ks-pass "pass:${{ secrets.SIGNING_STORE_PASSWORD }}" \
              --key-pass "pass:${{ secrets.KEY_PASSWORD }}" \
              --out "$signed_apk" \
              "$apk"
          
            "$APKSIGNER" verify "$signed_apk"
            rm "$apk"
          done
          
          rm release.keystore
          ls -lh "$PREVIEW_DIR"/app-*-preview.apk

      # Same guard as the stable release: a preview signed with anything but
      # the pinned Video key cannot be installed as an update.
      - name: Verify release signing certificate
        run: |
          set -uo pipefail
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1)
          status=0
          for apk in $(find app/build/outputs/apk -path "*/preview/*.apk" -type f ! -name "*-unsigned.apk"); do
            actual=$("$APKSIGNER" verify --print-certs "$apk" | grep -m1 'certificate SHA-256 digest' | awk '{print $NF}')
            if [ "$actual" != "$EXPECTED_SIGNER_SHA256" ]; then
              echo "::error::$(basename "$apk") is signed with '$actual', expected '$EXPECTED_SIGNER_SHA256'"
              status=1
            else
              echo "OK $(basename "$apk") -> $actual"
            fi
          done
          exit $status

      - name: Copy built artifacts
        run: |
          set -e
          mkdir -p preview
          declare -a apks=("universal" "arm64-v8a" "armeabi-v7a" "x86" "x86_64")

          for abi in "${apks[@]}"; do
            src="app/build/outputs/apk/preview/app-${abi}-preview.apk"
            dest="preview/video-preview-${abi}-${{ env.VERSION_TAG }}.apk"
            if [ -f "$src" ]; then
              cp "$src" "$dest"
              sha=$(sha256sum "$dest" | awk '{ print $1 }')
              echo "apk-${abi}-sha256=$sha" >> $GITHUB_ENV
            fi
          done

      - name: Create GitHub pre-release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.VERSION_TAG }}
          name: "Video ${{ env.VERSION_TAG }}"
          body: |
            
            ### Checksums
            | Variant | SHA-256 |
            | ------- | ------- |
            | arm64-v8a | ${{ env.apk-arm64-v8a-sha256 }} |
            | armeabi-v7a | ${{ env.apk-armeabi-v7a-sha256 }} |
            | Universal | ${{ env.apk-universal-sha256 }} |
            | x86 | ${{ env.apk-x86-sha256 }} |
            | x86_64 | ${{ env.apk-x86_64-sha256 }} |
          files: |
            preview/video-preview-universal-${{ env.VERSION_TAG }}.apk
            preview/video-preview-arm64-v8a-${{ env.VERSION_TAG }}.apk
            preview/video-preview-armeabi-v7a-${{ env.VERSION_TAG }}.apk
            preview/video-preview-x86-${{ env.VERSION_TAG }}.apk
            preview/video-preview-x86_64-${{ env.VERSION_TAG }}.apk
          draft: false
          prerelease: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
